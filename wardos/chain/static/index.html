<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>WardOS</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#EDF6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WardOS">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0F1A2E; --ink-2: #48546A; --ink-3: #6B778C; --line: #E7EBF0; --line-2: #D4DAE3; --surface: #FFFFFF;
  --ground: #EDF6F2; --glow-1: #D2F0E3; --glow-2: #DDEBFA; --glow-3: #EEF6D8; --selected: #E3F4EC;
  --blue: #2F6BFF; --blue-2: #1F55E0; --blue-wash: #EAF1FF;
  --red: #E5383B; --red-ink: #C4262B; --red-wash: #FFF0F0;
  --amber: #A85207; --amber-dot: #F59E0B; --amber-wash: #FFF7E8; --amber-line: #F7DDAE;
  --green: #0F9D63; --green-wash: #E6F7EF; --watch: #7055E8; --watch-wash: #F0ECFF;
  --shadow: 0 1px 2px rgba(15,26,46,.04), 0 10px 30px -18px rgba(20,70,60,.28);
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { color: var(--ink); font: 16px/1.42 Figtree, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden;
  background: radial-gradient(900px 520px at 6% -10%, var(--glow-1), transparent 70%), radial-gradient(800px 500px at 96% 0%, var(--glow-2), transparent 70%), radial-gradient(900px 600px at 60% 112%, var(--glow-3), transparent 70%), var(--ground); }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
h1, h2, h3, p { margin: 0; }

#shell { position: fixed; left: 0; right: 0; top: 0; height: var(--vvh, 100dvh); display: flex; flex-direction: column; }
.strip { flex: none; padding: 6px 16px; font-size: 13.5px; font-weight: 600; text-align: center; }
.strip.demo { background: #DDF2E8; color: #0F5C45; }
.strip.off { background: var(--amber-wash); color: var(--amber); border-bottom: 1px solid var(--amber-line); }
#cols { flex: 1; min-height: 0; display: flex; }
.col { position: relative; min-width: 0; overflow: hidden; flex: 1 1 0; }
.col.fixed { flex: 0 0 312px; }
.col + .col { border-left: 1px solid rgba(15,26,46,.07); }
.col.hide { display: none; }
.page { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px 16px 20px; scrollbar-width: thin; background: transparent; }
.in { max-width: 560px; margin: 0 auto; }
.col.fixed .page { background: rgba(255,255,255,.62); }
body.one .page { background: radial-gradient(420px 240px at 6% -4%, var(--glow-1), transparent 70%), radial-gradient(420px 240px at 96% 0, var(--glow-2), transparent 70%), var(--ground); }
.page.from-right { animation: fromRight .32s var(--ease) backwards; }
.page.from-left { animation: fromLeft .32s var(--ease) backwards; }
.page.to-left { animation: toLeft .32s var(--ease) forwards; pointer-events: none; }
.page.to-right { animation: toRight .32s var(--ease) forwards; pointer-events: none; z-index: 2; }
@keyframes fromRight { from { transform: translateX(100%); } }
@keyframes fromLeft { from { transform: translateX(-24%); opacity: .5; } }
@keyframes toLeft { to { transform: translateX(-24%); opacity: .5; } }
@keyframes toRight { to { transform: translateX(100%); } }
.page { padding-top: max(18px, env(safe-area-inset-top)); }

.back { display: inline-flex; align-items: center; gap: 3px; min-height: 40px; margin: -8px 0 2px -4px; padding-right: 8px; font-weight: 700; color: var(--blue-2); }
.back svg { width: 18px; height: 18px; }
.title { font-size: 25px; line-height: 1.12; font-weight: 800; letter-spacing: -.035em; margin-bottom: 12px; }
.lede { color: var(--ink-2); margin: -6px 0 14px; }
.label { font-size: 14px; font-weight: 700; color: var(--ink-2); margin: 16px 2px 7px; display: flex; justify-content: space-between; gap: 10px; }
.label span { font-weight: 500; color: var(--ink-3); }
.sheet { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.gap { margin-top: 12px; }

.ward-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.ward-top h1 { font-size: 21px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; flex: 1; min-width: 0; }
.ward-top small { display: block; font-size: 13.5px; font-weight: 500; letter-spacing: 0; color: var(--ink-3); margin-top: 1px; }
.round { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: var(--shadow); font-weight: 800; color: var(--ink); }
.round.pri { background: var(--blue); color: #fff; box-shadow: 0 8px 18px -9px rgba(47,107,255,.9); }
.needs { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 46px; padding: 0 14px; margin-bottom: 8px; border-radius: 14px; background: var(--amber-wash); color: var(--amber); font-weight: 700; }
.needs svg { margin-left: auto; width: 16px; height: 16px; }
.pt { display: grid; grid-template-columns: 40px 1fr auto; gap: 0 10px; width: 100%; padding: 12px 12px; border-bottom: 1px solid var(--line); transition: background .15s; }
.pt:last-child { border-bottom: 0; }
.pt:hover { background: #F8FBFA; }
.pt.on { background: var(--selected); }
.pt .bed { font-size: 23px; line-height: 1.1; font-weight: 800; letter-spacing: -.04em; text-align: center; }
.pt .bed small { display: block; font-size: 11.5px; line-height: 1.5; font-weight: 600; letter-spacing: 0; color: var(--ink-3); }
.pt .nm { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pt .nm i { font-style: normal; font-weight: 500; color: var(--ink-3); font-size: 14px; }
.pt .news { font-size: 14px; color: var(--ink-2); margin-top: 1px; }
.pt .news.red { color: var(--red-ink); font-weight: 700; }
.pt .news .plain, .gline .plain { color: var(--ink-2); font-weight: 500; } .gline .red { color: var(--red-ink); font-weight: 700; } .pt .news .red { color: var(--red-ink); font-weight: 700; }
.pt .agentline { font-size: 13px; color: var(--blue-2); font-weight: 600; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.pt .ago { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; padding-top: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.red { background: var(--red); box-shadow: 0 0 0 3px rgba(229,56,59,.15); }
.dot.amber { background: var(--amber-dot); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
.mini-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #CFE0FF; border-top-color: var(--blue); animation: spin .8s linear infinite; flex: none; }

.who h2 { font-size: 29px; line-height: 1.08; font-weight: 800; letter-spacing: -.04em; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.who .meta { color: var(--ink-2); margin-top: 4px; }
.who .meta button { font-weight: 700; color: var(--ink); border-bottom: 1.5px dotted var(--line-2); }
.who .dx { font-weight: 600; margin-top: 1px; }
.who .check { font-size: 13.5px; color: var(--amber); margin-top: 3px; font-weight: 600; }
.sev { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; font-size: 13px; letter-spacing: 0; font-weight: 700; border-radius: 99px; background: #EEF2F6; color: var(--ink-2); }
.sev.watch { background: var(--watch-wash); color: var(--watch); } .sev.unstable { background: var(--red-wash); color: var(--red-ink); } .sev.stable { background: var(--green-wash); color: var(--green); }
.sevpick { display: flex; gap: 4px; padding: 4px; margin-top: 9px; background: #fff; border-radius: 14px; box-shadow: var(--shadow); animation: fade .2s ease-out; }
.sevpick button { flex: 1; min-height: 38px; border-radius: 10px; text-align: center; font-weight: 600; font-size: 14.5px; color: var(--ink-2); }
.sevpick button[aria-pressed="true"] { background: var(--ink); color: #fff; }
@keyframes fade { from { opacity: 0; } }
.changed { padding: 13px 14px 2px; }
.changed .hd { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
.changed .hd span { font-weight: 500; color: var(--ink-3); font-size: 13.5px; }
.ch { display: grid; grid-template-columns: minmax(0, 1fr) 46px 40px 13px 58px; gap: 2px; width: 100%; align-items: center; min-height: 46px; border-bottom: 1px solid var(--line); }
.ch:last-child { border-bottom: 0; }
.ch.wide { grid-template-columns: minmax(0, 1fr) 44px 56px 13px 60px; }
.ch.wide .was { font-size: 13.5px; } .ch.wide .now { font-size: 15.5px; padding: 0 2px; }
.ch .nmx { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch .was { text-align: right; color: var(--ink-3); }
.ch .ar { text-align: center; color: var(--ink-3); font-size: 12px; }
.ch .now { justify-self: end; font-weight: 800; font-size: 17.5px; position: relative; padding: 0 5px; }
.now.bad { color: var(--red-ink); } .now.good { color: var(--green); }
.ch.fresh { animation: fresh 2.6s ease-out; }
@keyframes fresh { 0%, 35% { background: #FFF3C4; } 100% { background: transparent; } }
svg.sp { width: 44px; height: 18px; overflow: visible; display: block; }
svg.pen { position: absolute; left: -8px; top: -6px; width: calc(100% + 16px); height: calc(100% + 12px); overflow: visible; pointer-events: none; }
svg.pen path { fill: none; stroke: var(--red); stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 280; animation: draw .85s .32s cubic-bezier(.2,.7,.2,1) backwards; }
.quiet svg.pen path { animation: none; }
@keyframes draw { from { stroke-dashoffset: 280; } }
.more-line { display: block; width: 100%; padding: 11px 0; color: var(--blue-2); font-weight: 600; font-size: 14.5px; }
.nochange { padding: 12px 0 14px; color: var(--ink-2); }
.rw { display: grid; grid-template-columns: 88px minmax(0, 1fr) 14px; gap: 8px; width: 100%; align-items: center; min-height: 50px; padding: 4px 14px; border-top: 1px solid var(--line); transition: background .15s; }
.rw:hover { background: #F8FBFA; } .rw.on { background: var(--selected); }
.rw b { font-weight: 700; } .rw span { color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rw span em { font-style: normal; color: var(--red-ink); font-weight: 700; }
.rw svg { width: 15px; height: 15px; color: var(--ink-3); } .rw.link b { color: var(--blue-2); }
.acts { display: flex; gap: 8px; margin-top: 12px; }
.acts button { flex: 1; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 14px; background: rgba(255,255,255,.75); font-weight: 600; font-size: 14.5px; box-shadow: 0 0 0 1px rgba(15,26,46,.07); }
.acts svg { width: 17px; height: 17px; }
.flagline { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 46px; padding: 9px 13px; margin-top: 10px; border-radius: 14px; font-weight: 600; font-size: 14.5px; }
.flagline.red { background: var(--red-wash); color: var(--red-ink); } .flagline.amber { background: var(--amber-wash); color: var(--amber); } .flagline.watch { background: var(--watch-wash); color: var(--watch); }
.flagline svg { margin-left: auto; width: 15px; height: 15px; }

.ln { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 46px; padding: 8px 14px; border-top: 1px solid var(--line); }
.ln:first-child { border-top: 0; }
.ln .big { font-weight: 800; white-space: nowrap; } .ln .big.bad { color: var(--red-ink); } .ln .sm { color: var(--ink-3); font-size: 13.5px; }
.ln .col2 { min-width: 0; } .ln .col2 b { display: block; font-weight: 600; } .ln .col2 span { display: block; font-size: 13.5px; color: var(--ink-3); }
.lnk { color: var(--blue-2); font-weight: 700; font-size: 14px; white-space: nowrap; min-height: 34px; }
.pad14 { padding: 2px 14px; }
.fold { width: 100%; min-height: 46px; padding: 0 14px; font-weight: 700; color: var(--blue-2); }
.tb { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }
.tbw { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.tbw::-webkit-scrollbar { height: 6px; } .tbw::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
.tb th, .tb td { width: 84px; } .tb th:first-child, .tb td:first-child { width: 132px; }
.tb th { font-size: 12.5px; color: var(--ink-3); font-weight: 600; text-align: right; padding: 10px 8px; white-space: nowrap; }
.tb td { padding: 11px 8px; text-align: right; border-top: 1px solid var(--line); white-space: normal; overflow-wrap: anywhere; }
.tb th:first-child, .tb td:first-child { text-align: left; padding-left: 14px; position: sticky; left: 0; background: #fff; white-space: normal; overflow-wrap: anywhere; }
.tb th:last-child, .tb td:last-child { padding-right: 14px; } .tb .bad { color: var(--red-ink); font-weight: 800; }
.medd { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); flex: none; } .medd.check { background: var(--amber-dot); } .medd.stopped { background: var(--line-2); }
.ln.off b { text-decoration: line-through; color: var(--ink-3); font-weight: 500; }
.tick { width: 20px; height: 20px; border-radius: 6px; border: 1.8px solid var(--line-2); flex: none; }
.seg { display: inline-flex; padding: 3px; margin-bottom: 11px; background: #E7EEEB; border-radius: 11px; }
.seg button { min-height: 34px; padding: 0 16px; border-radius: 9px; font-weight: 600; font-size: 14.5px; color: var(--ink-2); } .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.rec { padding: 12px 14px; border-top: 1px solid var(--line); } .rec:first-child { border-top: 0; }
.rec h3 { font-size: 13.5px; font-weight: 700; color: var(--ink-3); margin-bottom: 3px; }
.rec button { display: block; width: 100%; padding: 2px 0; } .rec button:hover { color: var(--blue-2); }
.rec .lg { display: none; color: var(--ink-2); } .long .rec .lg { display: block; }
.graph { width: 100%; display: block; } .g-l { font-size: 10.5px; fill: var(--ink-3); } .g-v { font-size: 12px; font-weight: 700; fill: var(--ink); } .g-v.bad { fill: var(--red-ink); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 0 16px; border-radius: 15px; font-weight: 700; text-align: center; background: #fff; box-shadow: 0 0 0 1px rgba(15,26,46,.08), 0 1px 2px rgba(15,26,46,.05); transition: transform .1s; }
.btn:active { transform: scale(.98); }
.btn.pri { color: #fff; background: linear-gradient(180deg, #3D78FF, #2A62F2); box-shadow: 0 10px 22px -11px rgba(47,107,255,.9), inset 0 1px 0 rgba(255,255,255,.2); }
.btn.bad { color: var(--red-ink); }
.twobtn { display: flex; gap: 9px; margin-top: 12px; } .twobtn .btn { flex: 1; }
.fld { display: grid; grid-template-columns: 94px minmax(0, 1fr); align-items: center; min-height: 50px; padding: 0 14px; border-top: 1px solid var(--line); } .fld:first-child { border-top: 0; }
.fld label { color: var(--ink-2); font-size: 14.5px; } .fld input { width: 100%; border: 0; outline: 0; background: none; min-height: 44px; font-weight: 600; }
.fld input::placeholder { color: var(--ink-3); font-weight: 400; }
.heard { padding: 11px 14px; border-radius: 14px; background: var(--blue-wash); color: var(--blue-2); margin-bottom: 11px; font-size: 14.5px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; } .chip { min-height: 40px; padding: 0 14px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 1px rgba(15,26,46,.09); font-weight: 600; font-size: 14.5px; } .chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.q { padding: 15px; background: var(--amber-wash); border-radius: 18px; font-size: 17px; font-weight: 700; line-height: 1.3; }
.q small { display: block; margin-top: 5px; font-size: 13.5px; font-weight: 500; color: var(--amber); }
.opt { display: block; width: 100%; padding: 12px 14px; margin-top: 8px; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1px var(--amber-line); }
.opt b { display: block; font-size: 17px; font-weight: 800; } .opt span { color: var(--ink-3); font-size: 13.5px; }

.photo { position: relative; aspect-ratio: 3/3.4; max-height: 420px; width: 100%; overflow: hidden; border-radius: 16px; background: #363B44; display: grid; place-items: center; }
.quote { margin-top: 10px; padding: 11px 13px; border-radius: 14px; background: var(--green-wash); color: #0B6B47; font-weight: 600; font-size: 14.5px; }
.quote small { display: block; font-weight: 500; font-size: 13px; }

.alert { padding: 16px; border-radius: 20px; background: linear-gradient(170deg, #FFF6F6, #FFE9EA); }
.alert .bd { font-weight: 700; color: var(--red-ink); } .alert .vl { font-size: 42px; line-height: 1.1; font-weight: 800; letter-spacing: -.04em; color: var(--red-ink); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.alert .vl small { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); }

.tl { padding: 4px 14px 8px; } .tl > div { display: grid; grid-template-columns: 68px 10px minmax(0, 1fr); gap: 8px; padding: 8px 0; font-size: 14.5px; align-items: baseline; }
.tl time { color: var(--ink-3); font-size: 13.5px; } .tl i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); align-self: center; } .tl .bad i { background: var(--red); } .tl .bad { color: var(--red-ink); font-weight: 700; } .tl .warn i { background: var(--amber-dot); } .tl .warn { color: var(--amber); font-weight: 600; }
.bar { height: 6px; background: #DDEBE6; border-radius: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #19B37C, #2F6BFF); border-radius: 6px; transition: width .5s; }
.thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 11px; } .thumb { aspect-ratio: 3/4; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: #fff; box-shadow: 0 0 0 1px rgba(15,26,46,.08); color: var(--ink-3); }
.thumb.now { box-shadow: 0 0 0 2px var(--blue); color: var(--blue-2); } .thumb.ok { background: var(--green-wash); color: var(--green); } .thumb.bad { background: var(--red-wash); color: var(--red-ink); } .thumb.hold { background: var(--amber-wash); color: var(--amber); }
.drop { animation: drop .32s var(--ease) backwards; } @keyframes drop { from { transform: translateY(-8px); opacity: 0; } }

#pillbar { position: relative; flex: none; z-index: 20; display: flex; flex-direction: column; align-items: center; padding: 8px 12px max(12px, env(safe-area-inset-bottom)); }
#pillTop { position: absolute; left: 12px; right: 12px; bottom: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.pill { pointer-events: auto; width: min(360px, 100%); min-height: 56px; display: flex; align-items: center; gap: 8px; padding: 7px; border-radius: 28px; background: rgba(255,255,255,.9); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); box-shadow: 0 18px 38px -14px rgba(20,70,60,.55), 0 0 0 1px rgba(15,26,46,.07); color: var(--ink); transition: width .25s var(--ease); }
.pill.open, .pill.wide { width: min(560px, 100%); }
#hints { display: flex; flex-wrap: nowrap; gap: 6px; width: min(560px, 100%); margin-bottom: 7px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#hints::-webkit-scrollbar { display: none; }
#hints button { flex: none; min-height: 34px; padding: 0 12px; border-radius: 99px; background: rgba(255,255,255,.95); box-shadow: 0 0 0 1px rgba(15,26,46,.08); font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
#hints .tryl { flex: none; align-self: center; font-size: 13px; font-weight: 700; color: var(--ink-2); padding-right: 2px; }
#hints button::before, .tryline .chip::before { content: "“"; } #hints button::after, .tryline .chip::after { content: "”"; }
#hints button, .tryline .chip { font-style: italic; }
#hints.small button { min-height: 28px; padding: 0 10px; font-size: 12.5px; font-weight: 500; }
.pill .ic { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #F0F3F6; } .pill .ic.mic { background: var(--blue); color: #fff; }
.pill .ask { flex: 1; min-width: 0; min-height: 42px; text-align: center; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

addEventListener("online", checkNet);
async function api(path, opts = {}) {
  const headers = opts.json ? { "Content-Type": "application/json" } : {};

    else { const v = taskOf(id); if (v) { const up = { ...v, status: "stopped", active: false, summary: "Cancelled", steps: [...(v.steps || []), "Cancelled"] }; S.tasks.set(id, up); keepTask(up); } }
    paintTop(); paintPill(); render(null);

  async "task-stop"(id) { try { track(await api(`/agent/tasks/${id}/stop`, { method: "POST" })); toast("Stopped"); render(null); } catch (e) { toast(e.message); } },
  async "open-at"(a, b) { await today(a).catch(() => null); const v = b.dataset.v; return v ? at(a, v) : at(a); },
  async "fix-save"(n) {
    const c = S.refs[+n], text = $("#fixIn").value.trim(); if (!text) return;

    try { await api(`/facts/${c.fact_id}`, { method: "PATCH", json: { action: "correct", text, number: Number.isFinite(num) && /^[\d.,]+$/.test(text.replace(/\s/g, "")) ? num : null } }); toast("Saved. The record now uses your value."); S.correct = false; delete S.rec[S.adm]; await today(S.adm); back(); }
    catch (e) { toast(e.message); }
  },
  async looks(n) { const c = S.refs[+n]; try { await api(`/facts/${c.fact_id}`, { method: "PATCH", json: { action: "confirm" } }); toast("Marked as right"); await today(S.adm); back(); } catch (e) { toast(e.message); } },
  async ans(qid, b) {
    const typed = b.dataset.other ? ($("#qOtherIn")?.value || "").trim() : null;
    if (b.dataset.other && !typed) { toast("Type your answer first"); return; }

    try {
      const res = await api(`/questions/${qid}/answer`, { method: "POST", json: { answer: said, fact_id: b.dataset.fid || null } });
      toast(typed ? "Saved. Your answer is kept with the question." : res?.values_not_added ? "Saved. This page's values could not be added to the record." : res?.added ? `Saved. ${plural(res.added, "value")} from this page added to the record.` : said === "Hold it" ? "Saved. Held: the page is not added." : "Saved. The record uses your answer.");
      await today(S.adm); delete S.rec[S.adm]; back();
    } catch (e) { toast(e.message); $$("[data-act='ans']").forEach((x) => (x.disabled = false)); }
  },
  async "open-q"(a, b) { await today(a).catch(() => null); at(a, "question:" + b.dataset.v); },
  "alert-open"() { at(S.adm); },
  async admit() { const b = $("#nGo"); b.disabled = true; if (!(await createPatient(newForm()))) b.disabled = false; },
  "new-photo"() { S.newForm = newForm(); S.uploadFor = null; openCamera(takeFiles); },
  "retry-stuck"() { retryStuck(S.adm); },
  async "bed-save"() {
    const bed = $("#bedIn").value.trim() || null, occupied = !!S.bedAsk?.occupied && S.bedAsk.bed === bed, id = S.adm;
    S.bedAsk = null; const r = await saveField(id, "bed", bed, { confirm_occupied: occupied });
    if (r === true) { toast("Bed changed"); if (S.path.at(-1) === "bed") back(); }
    else if (r.status === 409) { S.bedAsk = { bed, occupied: true }; render(null); }
    else toast("Not saved - try again");
  },
  "watch-open"(id, b) { const adm = b.dataset.v; if (adm) at(adm, `watch-log:${id}`); },
  async "watch-stop"(id) { try { track(await api(`/agent/tasks/${id}/stop`, { method: "POST" })); toast("Watch stopped"); await today(S.adm); back(); } catch (e) { toast(e.message); } },
  "job-start"() { const t = tNow(); send(t?.admission.bed ? `get bed ${t.admission.bed}'s reports` : "get the reports"); },
  "job-open"() { const j = activeJob(); if (j?.admission_id) at(j.admission_id); },
  "question-open"(id) { const q = qmap().get(id); if (!q) return; if (q.status === "done" && q.card) { if (S.jobDone?.q === id) S.jobDone = null; return showCard(q.card, q.text); } open(`task:${id}`); },
  "done-open"() { const d = S.jobDone; S.jobDone = null; if (d.q) { S.jobDone = d; return ACT["question-open"](d.q); } if (d.task && !d.spec) return d.adm ? at(d.adm, `task:${d.task}`) : open(`task:${d.task}`); if (d.spec === "answer") return open("answer"); if (d.adm) return d.spec ? at(d.adm, d.spec) : at(d.adm); paintPill(); },
  "read-open"() { const r = curReading(); if (r && r.adm !== here()) return at(r.adm, "reading"); open("reading"); },
  "dis-make"() { const id = S.adm, k = S.finals[id]?.f; if (k?.status !== "running" && k?.status !== "done") ACT["dis-start"](); open("discharge"); },
  "dis-start"() {
    const id = S.adm; if (S.finals[id]?.f?.status === "running") return;
    S.finals[id] = { f: { status: "running", started_at: new Date().toISOString(), local: true } };   // the task exists at once; the server answers in the background
    render(null); paintTop();
    api(`/admissions/${id}/final`, { method: "POST" }).then((f) => { S.finals[id] = { f }; render(null); })
      .catch((e) => { const said = e.status === 429 || e.status === 409 ? e.message : "The summary could not start. Try again."; S.finals[id] = { f: { status: "error", msg: said } }; toast(said); render(null); });
  },
  "dis-open"() { const id = S.disReady; S.disReady = null; at(id, "discharge"); },
  "viewer-open"(i) { const t = tNow(); if (!t) return; V.ids = fileParts(t).photos; V.i = Math.max(0, Math.min(+i, V.ids.length - 1)); paintViewer(); },
  "viewer-close"() { V.ids = []; paintViewer(); },
  zoom(how, b) { (b.closest("[data-zoomhost]") || b.closest("#viewer")?.querySelector("[data-zoomhost]"))?._zoom?.by(how); },
  "photo-big"(sid) { const t = tNow(); V.ids = [[sid, (t?.sources || {})[sid] || {}]]; V.i = 0; paintViewer(); },
  "viewer-step"(d) { if (!V.ids.length) return; V.i = Math.max(0, Math.min(V.i + +d, V.ids.length - 1)); paintViewer(); },
  "more-q"(id) { (S.moreQ ||= new Set()).add(id); render(null); },
  "pill-cam"() { if (here()) { S.addOpen = !S.addOpen; paintPill(); return; } S.prefill = {}; S.newMode = null; open("new"); },
  detail(i) { const d = S.askDetail; if (!d) return; if (d.ai) return send(d.options[+i].label, d.ctx); send(`${d.words} ${d.options[+i].add}`); },
  "ask-open"() { const j = askingTask(); if (j) j.admission_id && rowOf(j.admission_id) ? at(j.admission_id, `task:${j.id}`) : open(`task:${j.id}`); },
  "task-ask"(arg) { const [id, i] = arg.split("|"), v = taskOf(id), a = openAsk(v); if (!a) return; const o = a.options[+i]; askDone.set(id, a.context_id); hint("Asked again"); render(null); paintPill(); return send(o.add || o.label, a.context_id); },
  "task-ask-other"(id) { const v = taskOf(id), a = openAsk(v), t = $("#taskAskIn")?.value.trim(); if (!a || !t) return; askDone.set(id, a.context_id); hint("Asked again"); render(null); paintPill(); return send(t, a.context_id); },
  "ai-other"() { const d = S.askDetail, v = $("#aiOtherIn")?.value.trim(); if (d?.ai && v) send(v, d.ctx); },
  "pill-ask"() { setPill("open", ""); },
  hint(words) { setPill("open", words); },
  "pill-mic"() { listen(); },
  "pill-close"() { S.askDetail = null; S.words = ""; setPill(null); },
  "voice-retry"() { const w = S.voiceRetry; S.voiceRetry = null; if (w) w(); },
  sugg(a, b) { const k = b.dataset.k; S.words = ""; if (k === "send") return send(a); setPill(null); if (k.startsWith("go:")) return k === "go:new" ? (S.prefill = {}, open("new")) : open(k.slice(3)); if (k.startsWith("act:")) return ACT[k.slice(4)](); },
  choose(i) { const c = S.card, x = c.choices[+i]; today(x.id).catch(() => null).finally(() => { S.adm = x.id; S.path = ["ward", "patient:" + x.id]; send(c.retry_text || "brief"); }); },
  async "old-go"(i, b) {
    const r = S.card.matches[+i]; b.disabled = true; b.textContent = "Opening...";
    try { const out = r.ready && r.admission_id ? { admission: { id: r.admission_id } } : await api(`/register/${encodeURIComponent(r.run_id)}/pull-in`, { method: "POST" }); await today(out.admission.id); at(out.admission.id); }
    catch (e) { toast(e.message); b.disabled = false; b.textContent = r.ready ? "Open" : "Bring in"; }
  },
  "old-ask"() { setPill("open", "old patient "); },
  "report-day"(d) { send(`reports ${d}`); },
  async "test-alert"() {
    try { const r = await api("/push/test", { method: "POST" });
      toast(r.sent ? `Test alert sent to ${plural(r.sent, "device")}${r.failed ? `. ${r.failed} could not be reached` : ""}.` : r.failed ? `${plural(r.failed, "device")} could not be reached. Turn alerts off and on again on that device.` : "No device has alerts on. Turn on \"Get danger alerts on this phone\" first, then try again.");
    } catch (e) { toast(e.status === 503 ? "Alerts are not set up on this server yet." : e.message); }
  },
  async "doc-add"() {
    const email = $("#dEmail").value.trim(), name = $("#dName").value.trim();
    if (!email || !name) { toast("Give the email and the name"); return; }
    try { await api("/doctors", { method: "POST", json: { email, name } }); toast("Added. They can sign in now."); document.activeElement?.blur(); S.html = ["", "", ""]; go("doctors"); } catch (e) { toast(e.message); }
  },
  async "doc-rm"(email) { if (!confirm(`Remove ${email}? They will be signed out within a minute.`)) return; try { await api(`/doctors/${encodeURIComponent(email)}/remove`, { method: "POST" }); toast("Removed"); go("doctors"); } catch (e) { toast(e.message); } },
};
ACT["cmd-open"] = (id) => { if (groupOf(id)) return showPath(`group:${id}`); const v = taskOf(id); if (v) showPath(jobSpec(v)); };
ACT["cmd-stop"] = async (id) => { const c = commands().find((x) => x.id === id); for (const v of c?.items || []) if (canCancel(v)) await ACT["task-cancel"](v.id); render(null); };
ACT["cmd-clear"] = (id) => { const set = clearedCmds(); set.add(id); try { localStorage.setItem(CLEARED_KEY, JSON.stringify([...set].slice(-100))); } catch {} render(null); };
ACT["done-close"] = () => { S.jobDone = null; paintPill(); };
ACT["q-open"] = () => { const q = lookingUp(); if (q) open(`task:${q.id}`); };
ACT["q-stop"] = () => { const q = lookingUp(); if (q) ACT["task-cancel"](q.id); };
ACT["job-open2"] = (arg) => {
  const [gid, jid] = arg.split("|"), v = taskOf(jid); if (!v) return;
  if (!wide3() && String(S.path[S.path.length - 1]) === `group:${gid}`) return void open(jobSpec(v));
  showPath(...(gid && groupOf(gid) ? [`group:${gid}`] : []), jobSpec(v));
};
document.addEventListener("change", (e) => { if (e.target.id === "micPick") pickMic(e.target.value); else if (e.target.id === "micPickMenu") setMicId(e.target.value); });
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go],[data-back],[data-act],[data-ref]");
  if (S.addOpen && !e.target.closest("#camBtn")) { S.addOpen = false; paintPill(); }
  if (!b) return;
  if (b.dataset.go) {
    if (b.dataset.go === "new") { S.prefill = {}; S.newMode = null; }
    if (isPatient(b.dataset.go) && b.dataset.go === S.path[1] && columns() >= 2) return void closePatient();
    return void open(b.dataset.go);
  }
  if ("back" in b.dataset) return back();
  if (b.dataset.ref !== undefined && !b.dataset.act) { S.correct = false; return void open(`photo:${b.dataset.ref}`); }
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset.arg, b);
});
$("#pill").addEventListener("submit", (e) => { e.preventDefault(); const f = $("#askIn"); if (f) send(f.value); });
document.addEventListener("keydown", (e) => { if (!V.ids.length) return; if (e.key === "Escape") ACT["viewer-close"](); else if (e.key === "ArrowRight") ACT["viewer-step"](1); else if (e.key === "ArrowLeft") ACT["viewer-step"](-1); else if (e.key === "+" || e.key === "=") $("#vstage")?._zoom?.by("in"); else if (e.key === "-") $("#vstage")?._zoom?.by("out"); else if (e.key === "0") $("#vstage")?._zoom?.by("fit"); });
document.addEventListener("keydown", (e) => { const b = e.target?.closest?.('[role="button"][data-act],[role="button"][data-go]'); if (b && e.target === b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); b.click(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.override === "open" || S.override === "check")) ACT["pill-close"](); });
let lastN = 0;
addEventListener("resize", () => { const n = layout(); if (n !== lastN) { lastN = n; S.slots = [null, null, null]; S.html = ["", "", ""]; $$(".col").forEach((c) => (c.innerHTML = "")); history.replaceState({ path: S.path, adm: S.adm, n: history.state?.n || 0 }, "", address()); render(null); } });
function fitKeyboard() { const v = visualViewport; if (v) { document.documentElement.style.setProperty("--vvh", `${v.height}px`); $("#shell").style.top = `${v.offsetTop}px`; } }
visualViewport?.addEventListener("resize", fitKeyboard); visualViewport?.addEventListener("scroll", fitKeyboard); fitKeyboard();

async function signedIn() {
  try { S.me = await api("/auth/me"); } catch { return;  }
  S.guest = !!S.me.demo; $("#demoBanner").hidden = !S.guest;
  if (S.guest) {                                          // a demo lasts for this tab only: a fresh open goes back to the sign-in page
    const pressed = new URLSearchParams(location.search).get("demo") === "1";
    if (pressed) { try { sessionStorage.setItem("wardos.demo", "1"); } catch {} history.replaceState(history.state, "", location.pathname + location.hash); }
    else if (!sessionStorage.getItem("wardos.demo")) { location.replace("/auth/logout"); return; }
  }
  render(null);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !S.offline) refreshAll(); });
setInterval(() => { if (!S.offline && !document.hidden && !S.rec2 && !S.override) refreshAll(); }, 60000);
(async () => {
  lastN = layout();
  const hit = location.hash.match(/^#\/a\/([^/]+)(\/alert)?/);
  if (hit) { S.adm = hit[1]; S.path = ["ward", "patient:" + hit[1], ...(hit[2] ? ["alert"] : [])]; }
  history.replaceState({ path: S.path, adm: S.adm, n: history.state?.n || 0 }, "", address());
  await render(null);
  const who = signedIn(), first = hit ? today(hit[1]).catch(() => null) : null;
  await who;
  if (hit) { await first; await render(null); }
  await loadWard();
  await render(null);
  loadTasks(true).then(() => render(null));
  await fetchVisible();
  loadPages().then(() => render(null));
})();
