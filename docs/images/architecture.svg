<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="760" height="640" rx="18" fill="#f4faf6"/>
<g text-anchor="middle">
<rect x="150" y="24" width="360" height="62" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="330" y="52" font-size="17" font-weight="700" fill="#1e293b">Doctor</text><text x="330" y="73" font-size="13" fill="#475569">photos, voice, one sentence</text>
<rect x="150" y="116" width="360" height="62" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="330" y="144" font-size="17" font-weight="700" fill="#1e293b">WardOS server and record</text><text x="330" y="165" font-size="13" fill="#475569">every value linked to its source</text>
<rect x="150" y="208" width="360" height="62" rx="14" fill="#d1f2e0" stroke="#10b981" stroke-width="2"/>
<text x="330" y="236" font-size="17" font-weight="700" fill="#1e293b">Agents and planner</text><text x="330" y="257" font-size="13" fill="#475569">job list, review after each job</text>
<rect x="150" y="300" width="360" height="62" rx="14" fill="#2563eb"/>
<text x="330" y="328" font-size="17" font-weight="700" fill="#fff">Meta Muse Spark</text><text x="330" y="349" font-size="13" fill="#dbeafe">reads, plans, chooses, learns</text>
<rect x="150" y="392" width="360" height="62" rx="14" fill="#d1f2e0" stroke="#10b981" stroke-width="2"/>
<text x="330" y="420" font-size="17" font-weight="700" fill="#1e293b">Hospital robot</text><text x="330" y="441" font-size="13" fill="#475569">saved skills, Chrome, write firewall</text>
<rect x="150" y="484" width="360" height="62" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="330" y="512" font-size="17" font-weight="700" fill="#1e293b">Hospital website</text><text x="330" y="533" font-size="13" fill="#475569">no API, read-only</text>
<g stroke="#2563eb" stroke-width="2" marker-end="url(#a)"><path d="M330 86V114"/><path d="M330 178V206"/><path d="M330 270V298"/><path d="M330 362V390"/><path d="M330 454V482"/></g>
<rect x="560" y="116" width="170" height="62" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="645" y="144" font-size="15" font-weight="700" fill="#991b1b">Alerts</text><text x="645" y="165" font-size="12" fill="#991b1b">danger only</text>
<path d="M510 147H558" stroke="#dc2626" stroke-width="2" marker-end="url(#a)" fill="none"/>
<path d="M510 423H620V239H512" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="680" y="318" font-size="14" font-weight="700" fill="#2563eb">Agent loop</text>
<text x="680" y="340" font-size="12" fill="#475569">plan, act, check,</text><text x="680" y="357" font-size="12" fill="#475569">learn or repair</text>
<text x="330" y="590" font-size="13" fill="#475569">Muse Spark is used only to choose, learn or repair.</text>
<text x="330" y="610" font-size="13" fill="#475569">Plain code replays skills and reads the answers.</text>
</g></svg>
